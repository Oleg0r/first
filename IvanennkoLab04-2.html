<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Назва сторінки</title>
</head>
<body>
    <header style=" background-color: rgb(138, 228, 138);">
        <marquee behavior="alternate">eee</marquee>
    </header>
    <header style="background-color: rgb(213, 69, 69);">
        <marquee behavior="scroll">eee</marquee>
    </header>
    <header style="background-color: rgb(80, 80, 235);">
        <marquee direction="right" behavior="slide">eee</marquee>
    </header>
    <header style="background-color: burlywood;">
        <marquee scrollamount="10">eee</marquee>
    </header>
    <header style="background-color: rgb(247, 142, 103);">
        <marquee scrollamount="5">eee</marquee>
    </header>
</body>
</html>
