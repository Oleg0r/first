<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Назва сторінки</title>
</head>
<body>
    <div style="display: flex;">

        <header style="background-color: rgb(138, 228, 138); height: 1000px; width: 50px;">
            <marquee height="1000" direction="down" behavior="alternate">eee</marquee>
        </header>

        <header style="background-color: rgb(213, 69, 69); height: 1000px; width: 50px;">
            <marquee height="1000" direction="up" behavior="scroll">eee</marquee>
        </header>

        <header style="background-color: rgb(80, 80, 235); height: 1000px; width: 50px;">
            <marquee height="1000" direction="down" behavior="slide">eee</marquee>
        </header>

        <header style="background-color: burlywood; height: 1000px; width: 50px;">
            <marquee height="1000" direction="down" scrollamount="10">eee</marquee>
        </header>

        <header style="background-color: rgb(247, 142, 103); height: 1000px; width: 50px;">
            <marquee height="1000" direction="down" scrollamount="5">eee</marquee>
        </header>

    </div>
</body>
</html>
